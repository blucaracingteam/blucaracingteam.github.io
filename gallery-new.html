<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - BLUCARACINGTEAM</title>

<style>
body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#0b1e3c;
color:white;
}

nav{
background:#08162c;
padding:15px;
text-align:center;
}

nav a{
color:white;
margin:10px;
text-decoration:none;
font-weight:bold;
}

.container{
padding:20px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.gallery img{
width:100%;
border-radius:10px;
cursor:pointer;
transition:0.3s;
}

.gallery img:hover{
transform:scale(1.05);
}

/* apertura immagine */
.modal{
display:none;
position:fixed;
z-index:1000;
padding-top:60px;
left:0;
top:0;
width:100%;
height:100%;
background-color:rgba(0,0,0,0.9);
}

.modal img{
margin:auto;
display:block;
max-width:90%;
max-height:80%;
}

.close{
position:absolute;
top:20px;
right:40px;
color:white;
font-size:40px;
cursor:pointer;
}
</style>
</head>

<body>

<nav>
<a href="index.html">Home</a>
<a href="storia.html">Storia</a>
<a href="team.html">Team</a>

</nav>

<h1>Gallery BLUCARACINGTEAM</h1>

<div class="gallery">

<a onclick="openModal('IMG_1507.jpeg')"><img src="IMG_1507.jpeg"></a>
<a onclick="openModal('IMG_1505.jpeg')"><img src="IMG_1505.jpeg"></a>

</div>

</div>

<!-- MODAL FOTO -->
<div id="modal" class="modal">
<span class="close" onclick="closeModal()">×</span>
<img id="modal-img">
</div>

<script>
function openModal(src){
document.getElementById("modal").style.display="block";
document.getElementById("modal-img").src=src;
}

function closeModal(){
document.getElementById("modal").style.display="none";
}
</script>

</body>
</html>
